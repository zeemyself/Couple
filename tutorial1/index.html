<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Couple Maze (Modernized)</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #243b55, #141e30 50%, #090d14);
      }

      .game-shell {
        padding: 16px;
        border-radius: 16px;
        background: rgba(10, 14, 21, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }

      canvas {
        display: block;
        width: min(95vw, 950px);
        height: auto;
        border-radius: 12px;
        background: #223;
      }
    </style>
  </head>
  <body>
    <main class="game-shell">
      <canvas id="gameCanvas" width="950" height="600" aria-label="Couple Maze game"></canvas>
    </main>
    <script type="module" src="./src/game.js"></script>
  </body>
</html>
