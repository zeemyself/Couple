<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Couple Maze</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #2f365f, #141824 60%);
      }

      .game-shell {
        width: min(96vw, 980px);
        display: grid;
        gap: 0.8rem;
      }

      .hud {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.95rem;
        color: #d9e2ff;
      }

      .controls {
        display: flex;
        gap: 0.6rem;
        align-items: center;
      }

      button {
        border: 0;
        background: #5f7cff;
        color: white;
        border-radius: 0.6rem;
        padding: 0.5rem 0.9rem;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        filter: brightness(1.08);
      }

      canvas {
        width: 100%;
        max-width: 960px;
        aspect-ratio: 20 / 13;
        border-radius: 1rem;
        border: 1px solid #5f7cff66;
        background: #0a0d16;
        box-shadow: 0 18px 40px #00000075;
      }
    </style>
  </head>
  <body>
    <main class="game-shell">
      <header class="hud">
        <div id="stageText">Stage: 1</div>
        <div id="messageText">Press Start (or Space) to play.</div>
        <div class="controls">
          <span id="timerText">Time: 0</span>
          <button id="startButton" type="button">Start</button>
        </div>
      </header>
      <canvas id="gameCanvas" width="960" height="624" aria-label="Couple Maze game area"></canvas>
    </main>

    <script type="module" src="main.js"></script>
  </body>
</html>
